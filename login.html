<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vicious Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #2b0000, black 70%);
}

.glow {
  position: absolute;
  width: 300px;
  height: 300px;
  background: red;
  filter: blur(120px);
  opacity: 0.3;
  border-radius: 50%;
}
</style>
</head>

<body class="flex items-center justify-center h-screen text-white">

<div class="glow"></div>

<!-- LOGIN BOX -->
<div class="w-full max-w-md bg-black/70 border border-red-600 rounded-2xl p-8 backdrop-blur-lg">

  <h1 class="text-3xl font-bold text-center text-red-500">VICIOUS LOGIN</h1>
  <p class="text-center text-gray-400 mt-2">Access your dashboard</p>

  <div class="mt-6 space-y-4">

    <input id="username" type="text" placeholder="Username"
      class="w-full p-3 bg-black border border-red-600 rounded">

    <input id="password" type="password" placeholder="Password"
      class="w-full p-3 bg-black border border-white rounded">

    <button onclick="loginUser()"
      class="w-full bg-red-600 hover:bg-red-700 py-3 rounded font-bold">
      Login
    </button>

    <p id="msg" class="text-center text-sm mt-2"></p>

  </div>

</div>

<!-- LOGIN SCRIPT -->
<script>
function loginUser() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  // USERS
  if (user === "vicious_varun" && pass === "varun_vicious") {
    msg.style.color = "lime";
    msg.innerText = "Login successful! Redirecting...";
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);
  }

  else if (user === "vicious_own" && pass === "2005") {
    msg.style.color = "lime";
    msg.innerText = "Login successful! Redirecting...";
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1000);
  }

  else {
    msg.style.color = "red";
    msg.innerText = "Invalid username or password!";
  }
}
</script>

</body>
</html>
